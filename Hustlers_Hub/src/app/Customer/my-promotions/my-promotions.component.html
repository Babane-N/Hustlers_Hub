<div class="promotion-card"
     *ngFor="let promotion of promotions">

  <!-- Gallery -->
  <div class="promo-gallery"
       *ngIf="(promotion.images ?? []).length > 0; else noImage">

    <div class="gallery-item main">
      <img [src]="promotion.images![0]"
           [alt]="promotion.title">
    </div>

    <div class="gallery-item secondary"
         *ngIf="promotion.images!.length > 1">

      <img [src]="promotion.images![1]"
           [alt]="promotion.title">

      <div class="more-overlay"
           *ngIf="promotion.images!.length > 2">
        +{{ promotion.images!.length - 2 }}
      </div>

    </div>

  </div>

  <ng-template #noImage>
    <div class="promo-placeholder">
      No Image Available
    </div>
  </ng-template>

  <div class="card-content">

    <div class="card-header">

      <h3>{{ promotion.title }}</h3>

      <span class="boosted-badge"
            *ngIf="promotion.isBoosted">
        BOOSTED
      </span>

    </div>

    <p class="description">
      {{ promotion.description }}
    </p>

    <div class="details">
      <span>
        Expires:
        {{ promotion.expiresAt | date }}
      </span>
    </div>

    <div class="actions">

      <button class="edit-btn"
              (click)="editPromotion(promotion)">
        Edit
      </button>

      <button class="delete-btn"
              (click)="deletePromotion(promotion.id)">
        Delete
      </button>

    </div>

  </div>

</div>
